model:
  hf_name: meta-llama/Meta-Llama-3.1-8B
  mlx_name: mlx-community/Meta-Llama-3.1-8B-bf16
  num_layers: 32
  num_q_heads: 32
  num_kv_heads: 8
  head_dim: 128
  context_window: 131072
  rope:
    theta: 500000.0
    method: standard
    scaling: null
    source: model.rotary_emb
data:
  vectors_dir: data/vectors
  results_dir: results
tasks:
- math_calc
- code_run
- longbook_sum_eng
- kv_retrieval
- multi_doc_qa
- single_doc_qa
skip_idealized:
- ideal_equal_splits
evaluation:
  seed: 42
  n_queries: 1
  n_examples: 1
  use_rope: true
  normalize_keys_to_median_norm: false
  normalize_queries_to_median_norm: false
  compute_statistics: true
  compute_group_cosine_distribution: true
  group_cosine_distribution_bins: 50
  center_candidate_keys_for_pi_plot: true
  head_mode: "selected_heads"
  layers: "all"
  custom_heads:
    - {layer: 0, q_head: 22, kv_head: 5}
  exclude_sink_token: true
  local_window:
    size: 0
  budget_sweep:
    absolute:
    - 16
    - 32
    - 64
    - 128
    - 256
    - 512
    - 1024
    - 2048
    - 4096
algorithm_configs:
  multiq:
    n_query_clusters:
    - 256
    n_groups: 256
    modes:
    - topk
    - hybrid
    top_k_sweep:
    - 0
    - 1
    - 2
    - 3
    - 5
    - 7
    - 10
    - 12
  kmeans:
    n_clusters: 256
    modes:
    - topk
    - hybrid
    top_k_sweep:
    - 0
    - 1
    - 2
    - 3
    - 5
    - 7
    - 10
    - 12
  lsh_crosspoly: {}
  lsh_cp_group: {}
  lsh_crosspoly_multiprobe: {}
  lsh_crosspoly_clustered:
    k_dims:
    - 2
    - 3
    - 4
    - 6
    - 8
    - 11
    - 16
    - 23
    - 32
    - 45
    - 64
    - 90
    - 128
    n_repetitions:
    - 1
  lsh_simhash_snis:
    K_sweep:
    - 8
    - 9
    - 10
    - 11
    L_sweep:
    - 10
    - 50
    - 100
    - 150
    - 200
    min_hits: 2
    center_keys: true
  lsh_crosspoly_snis:
    n_rotations:
    - 1
    - 2
    - 4
    - 8
    L_sweep:
    - 10
    - 50
    - 100
    - 150
    - 200
    min_hits: 2
    center_keys: true
  kmeans_value:
    n_clusters_sweep:
    - 128
    - 512
    - 1024
    - 2048
    - 4096
  kmeans_key:
    n_clusters_sweep:
    - 128
    - 512
    - 1024
    - 2048
    - 4096
  value_cluster_is:
    n_clusters_sweep:
    - 1024
    threshold_percentiles:
    - 50
    - 75
    - 90
    - 95
plotting:
  figsize:
  - 16
  - 10
  dpi: 200
  # Ordering for group_token_probability_table:
  # - key_logit (default): all keys globally by decreasing e^{l_i}/Z (blue curve continuous, on top)
  # - group_then_key: groups by decreasing e^{l_g}, then keys in-group by e^{l_i}/Z
  group_token_probability_order: "key_logit"
  log_scale: true
  linear_scale: true
  idealized_linestyle: --
  algorithm_linestyle: '-'
  error_bands: false
  idealized_colors:
    IdealTopK: '#d62728'
    IdealSampling: '#2ca02c'
    IdealEqualSplits: '#1f77b4'
    IdealEqualWeightSplits: '#9467bd'
  algorithm_colors:
    kmeans:
      topk: '#ffb380'
      hybrid: '#ff7f0e'
      marker: D
    multiq:
      topk: '#7fbfff'
      hybrid: '#1f77b4'
      marker: X
    lsh_crosspoly:
      topk: '#17becf'
      hybrid: '#17becf'
      marker: h
    lsh_crosspoly_clustered:
      topk: '#e91e9e'
      hybrid: '#e91e9e'
      marker: h
    simhash_snis:
      topk: '#800080'
      hybrid: '#800080'
      marker: X
    cp_snis:
      topk: '#2196f3'
      hybrid: '#2196f3'
      marker: P
    kmeans_value:
      topk: '#e91e63'
      hybrid: '#e91e63'
      marker: v
    kmeans_key:
      topk: '#00897b'
      hybrid: '#00897b'
      marker: ^
    vcis_c1024_p50:
      topk: '#ffe082'
      hybrid: '#ffe082'
      marker: s
    vcis_c1024_p75:
      topk: '#ffb74d'
      hybrid: '#ffb74d'
      marker: s
    vcis_c1024_p90:
      topk: '#ff9800'
      hybrid: '#ff9800'
      marker: s
    vcis_c1024_p95:
      topk: '#e65100'
      hybrid: '#e65100'
      marker: s
