evaluation:
  seed: 42
  n_queries: 1
  n_examples: 1
  n_train_queries: 5000   # |Q| trailing-window size when train_q_strategy=trailing
  train_q_strategy: kvsculpt   # trailing | kvsculpt — shared by learned / TFCFW-lq / kvsculpt
  n_synthetic: 1000            # synthetic future queries when train_q_strategy=kvsculpt
  rope_theta: 500000.0          # RoPE theta for kvsculpt-type query construction
  exact_denominator: false       # shared by learned / TFCFW-lq / kvsculpt
  device: cuda                  # shared by all torch algorithms (wildcat2/3, FCFW, TFCFW, learned, kvsculpt)
  use_rope: true
  normalize_keys_to_median_norm: false
  normalize_queries_to_median_norm: false
  compute_statistics: false
  measure_timing: true
  compute_group_cosine_distribution: false
  group_cosine_distribution_bins: 50
  center_candidate_keys_for_pi_plot: true
  debug_top_logits: false
  plot_fullattention_pq_topk_profiles: true
  plot_probe_training_error: false
  head_mode: "selected_heads"
  layers: "all"
  custom_heads:
    - {layer: 0, q_head: 22, kv_head: 5}
  exclude_sink_token: true
  local_window:
    size: 1024
  budget_sweep:
    absolute:
