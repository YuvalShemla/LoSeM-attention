  wildcat2:
    # Coreset budget: evaluation.budget_sweep.absolute (per candidate region).
    # Sink + local window: evaluation.exclude_sink_token, local_window.size.
    # device: from evaluation.device (or override here)
    num_bins: 1
    q_scale_mode: key_max   # match examples/kvcache/measure_attention_error.py (max key norm)
    exact_denominator: false   # normalize by exact causal KDE Z_exact, not coreset KDE
    # q_scale_mode: query   # use the actual query norm as kernel temperature
    # bin_r: 12   # optional: kvcache-style pivots per bin (budget ≈ n_bins * bin_r)
    # phi: null   # kernel temperature adjustment (microsoft/wildcat)
  wildcat3:
    # Directly calls wildcat/examples/kvcache/compress_kv_cache.py.
    # Requested budget is converted to a middle compression_ratio.
    # num_bins=1 makes the compressed middle coreset size equal to budget.
    num_bins: 1
    dtype: float32
    # device: from evaluation.device (or override here)
    # bin_r: null    # optional alternative to num_bins, original press-style
  fc_frank_wolfe_l2:
    # Fully-corrective Frank-Wolfe coreset selection in Gaussian kernel space.
    # Same temperature / weighting / WtdAttn as wildcat2 (q_scale_mode shared);
    # only the coreset selection differs (FCFW greedy vs randomly-pivoted Nystrom).
    # Deterministic and nested => error is monotone non-increasing in budget.
    num_bins: 1
    q_scale_mode: key_max   # match wildcat2 (max key norm); or query
    exact_denominator: false   # normalize by exact causal KDE Z_exact, not coreset KDE
    # bin_r: null           # optional per-bin coreset size
    # phi: null             # kernel temperature adjustment
    # device: from evaluation.device (or override here)
  tensor_fcfw_l2:
    # Value-aware tensor FCFW: approximates sum_i phi(k_i) (x) [1, v_i] instead
    # of sum_i phi(k_i). Coreset keys are existing keys; coreset value vectors
    # are synthetic (the algorithm's own fully-corrective tensor solve). Same
    # temperature / WtdAttn as wildcat2. Deterministic and nested.
    num_bins: 1
    q_scale_mode: key_max   # match wildcat2 (max key norm); or query
    oracle: fc_lq              # fw = argmax ||G[i,:]||^2; or omp
    exact_denominator: false   # normalize by exact causal KDE Z_exact, not coreset KDE
    # bin_r: null
    # phi: null
    # device: from evaluation.device (or override here)
  tensor_fcfw_lq:
    # Tensor FCFW under the query-weighted lq norm. Instead of the RKHS-l2
    # (Frobenius) error of sum_i phi(k_i) (x) [1, v_i], it minimizes
    #   ||sigma - sigma'||_* = E_{q in Q} | (sigma - sigma') . psi(q) |,
    # i.e. the L1-over-queries average of the unnormalized readout error, where
    # Q is the set of earlier-context queries (same probes as `learned`).
    # Selection = FCFW in the empirical attention Gram A^T A (A_{q,i} =
    # exp(scale q.k_i)); correction = IRLS for the L_{2,1} solve. No temperature
    # rescaling / centering (uses the real attention kernel over Q).
    # Probe set Q: evaluation.n_train_queries (shared with learned).
    # Selection: fw/omp = fast Cholesky surrogate; fc_lq = exact FC-lq;
    # residual_lq = one-column lq residual scoring + scheduled refresh;
    # residual_lq_deflated = residual_lq with QR-deflated candidate columns.
    oracle: omp        # fw | omp | fc_lq | residual_lq | residual_lq_deflated
    irls_iters: 5              # final lq solve on the selected support
    scoring_irls_iters: 5      # residual_lq: IRLS steps for candidate scoring
    correction_irls_iters: 5  # residual_lq: IRLS steps on scheduled refresh steps
    correction_period: 0   # refresh every ceil(|S|/period) keys; 0 => every key
    lbfgs_steps: 100         # L-BFGS on (K,V) for unnormalized numerator; then denom weights if exact_d=false
    lbfgs_lr: 0.5
    lbfgs_inner_iter: 10
    rcond: 1.0e-3           # relative SVD cutoff for the value solve (safety when |Q| ~ budget)
    n_sink: 1                 # match evaluation.exclude_sink_token
    local_window: 1024        # match evaluation.local_window.size
    show_progress: true      # null => on when stderr is a TTY; true/false to force
    # exact_denominator: from evaluation.exact_denominator
    # device: from evaluation.device (or override here)
  learned:
    # Gradient-descent synthetic (K', V', w') for the residual (candidate) region.
    # Training matches the exact eval pipeline (exact sink + local window + learned
    # pairs, normalized as weighted_attention) against true full attention over the
    # fixed reference (test) context. Only the residual pairs are learned; special
    # tokens are added at evaluation. Each pair carries a learnable mass w'.
    # Pure init (k-means or random over candidates), not FCFW. Nested/monotone
    # budget sweep: larger budgets freeze the smaller trained coreset and train
    # only the new pairs (so error is non-increasing in budget).
    # Probe / training set Q: evaluation.train_q_strategy (trailing | kvsculpt).
    init: kmeans              # kmeans | random
    lr: 0.05
    n_steps: 500
    batch_size: 128
    loss: relative_l2         # relative_l2 | mse
    rel_l2_floor: 0.001        # floor the relative-L2 denominator (stabilizes high-entropy heads)
    val_fraction: 0.1
    early_stop_patience: 50
    lr_decay_step: 200
    lr_decay_gamma: 0.5
    nested_budget: true       # monotone: freeze smaller coreset, train only new pairs
    kmeans_subsample: 8192    # cap candidates used for k-means init
    n_sink: 1                 # match evaluation.exclude_sink_token
    local_window: 1024        # match evaluation.local_window.size
    # exact_denominator: from evaluation.exact_denominator
    # device: from evaluation.device (or override here)
  kvsculpt:
    # Distill candidate region into unconstrained (K_c, V_c) via L-BFGS + ridge V-solve.
    # Training queries = retain-zone probes + synthetic future queries (De-RoPE).
    # Loss = output MSE + log-sum-exp matching vs full-cache attention.
    n_k_steps: 100
    v_solve_every: 5
    lbfgs_lr: 0.5
    lbfgs_inner_iter: 10
    ridge_lambda: 1.0e-3
    n_sink: 1
    local_window: 1024
    # n_synthetic / rope_theta / exact_denominator: from evaluation.*
    # device: from evaluation.device (or override here)
  kmeans_kk: {}
  tree_attention:
