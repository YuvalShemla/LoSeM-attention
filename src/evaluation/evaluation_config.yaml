# ══════════════════════════════════════════════════════
# Example Configs for Common Scenarios
# ══════════════════════════════════════════════════════
#
# --- Scout: 1 example, all heads, all 4 layers ---
# evaluation:
#   n_examples: 1
#   n_queries: 50
#   head_mode: "all_heads"
#   layers: [0, 17, 19, 31]
#
# --- Full evaluation: 10 examples, selected heads ---
# evaluation:
#   n_examples: 10
#   n_queries: 100
#   head_mode: "selected_heads"
#
# --- Debug: 1 example, one head, tiny sweep ---
# evaluation:
#   n_examples: 1
#   n_queries: 10
#   head_mode: "custom"
#   custom_heads:
#     - {layer: 17, q_head: 0, kv_head: 0}
#   budget_sweep:
#     absolute: [32, 256]
