model:
  hf_name: meta-llama/Meta-Llama-3.1-8B
  mlx_name: mlx-community/Meta-Llama-3.1-8B-bf16
  num_layers: 32
  num_q_heads: 32
  num_kv_heads: 8
  head_dim: 128
  context_window: 131072
  rope:
    theta: 500000.0
    method: standard
    scaling: null
    source: model.rotary_emb
data:
  vectors_dir: data/vectors
  results_dir: results
tasks:
- math_calc
- code_run
- longbook_sum_eng
- kv_retrieval
- multi_doc_qa
- single_doc_qa
skip_idealized:
- ideal_equal_splits
- ideal_sampling_is
evaluation:
  seed: 42
  n_queries: 1
  n_examples: 1
  use_rope: true
  normalize_keys_to_median_norm: false
  normalize_queries_to_median_norm: false
  compute_statistics: true
  compute_group_cosine_distribution: true
  group_cosine_distribution_bins: 50
  center_candidate_keys_for_pi_plot: true
  head_mode: "selected_heads"
  layers: "all"
  custom_heads:
    - {layer: 0, q_head: 22, kv_head: 5}
  exclude_sink_token: true
  local_window:
    size: 0
  budget_sweep:
    absolute:
    - 16
    - 32
    - 64
    - 128
    - 256
    - 512
    - 1024
    - 2048
    - 4096
algorithm_configs:
  multiq:
    n_query_clusters:
    - 256
    n_groups: 256
    modes:
    - topk
    - hybrid
    top_k_sweep:
    - 0
    - 1
    - 2
    - 3
    - 5
    - 7
    - 10
    - 12
  kmeans:
    n_clusters: 256
    modes:
    - topk
    - hybrid
    top_k_sweep:
    - 0
    - 1
    - 2
    - 3
    - 5
    - 7
    - 10
    - 12
  lsh_crosspoly: {}
  lsh_cp_group: {}
  lsh_crosspoly_multiprobe: {}
  lsh_crosspoly_clustered:
    k_dims:
    - 2
    - 3
    - 4
    - 6
    - 8
    - 11
    - 16
    - 23
    - 32
    - 45
    - 64
    - 90
    - 128
    n_repetitions:
    - 1
  lsh_simhash_snis:
    K_sweep:
    - 8
    - 9
    - 10
    - 11
    L_sweep:
    - 50
    - 100
    - 200
    min_hits: 2
    center_keys: true
  lsh_crosspoly_snis:
    n_rotations:
    - 1
    - 2
    - 4
    - 8
    L_sweep:
    - 50
    - 100
    - 200
    min_hits: 2
    center_keys: true
  kmeans_value:
    n_clusters_sweep:
    - 128
    - 512
    - 1024
    - 2048
    - 4096
  kmeans_key:
    n_clusters_sweep:
    - 128
    - 512
    - 1024
    - 2048
    - 4096
  value_cluster_is:
    n_clusters_sweep:
    - 1024
    threshold_percentiles:
    - 50
    - 75
    - 90
    - 95
  cp_value_cluster:
    n_rotations:
    - 1
    - 2
    - 4
    - 8
    L_sweep:
    - 10
    - 50
    - 100
    - 150
    - 200
    min_hits: 2
    center_keys: true
    n_clusters: 1024
    variants:
    - snis_residual
    - subset_residual
  vcluster_meankey: {}
  vcluster_sampled:
    n_clusters_sweep:
    - 1024
  vcluster_topk:
    n_clusters_sweep:
    - 1024
  kcluster_sampled:
    n_clusters_sweep:
    - 1024
  vcluster_lastkey:
    n_last_sweep:
    - 1
    - 2
    - 3
  vcluster_meanlogit: {}
  vattention_pq:
    m_sweep:
    - 8
  ivfpq_cluster:
    n_cells: 1024
    nprobe_sweep:
    - 32
    m: 8
  kmeans_kk: {}
  tree_attention:
    starting_depths:
    - 2
    - 3
    - 4
    - 5
    max_depth: 14
    topk_fracs:
    - 0.5
    tree_dir: data/trees
  kcluster_topk:
    n_clusters_sweep:
    - 1024
    methods:
    - oracle
    - pq
    m_pq: 8
  oracle_cluster_pq_topk:
    n_clusters_sweep:
    - 1024
    m_pq: 8
  qclust_topk:
    n_proto: 8
    n_train_queries:
    - 100
    - 999999
  qclust_aug_topk:
    n_proto: 8
    n_train_queries:
    - 100
  keyclust_valsub:
    n_val_clusters:
    - 4
    - 8
  qclust_valsub:
    n_proto: 8
    n_train_queries:
    - 100
    n_val_clusters:
    - 4
  topk_key_clusters:
    n_clusters_sweep:
    - 1024
  topk_oracle_clusters:
    n_clusters_sweep:
    - 1024
  topk_value_clusters:
    n_clusters_sweep:
    - 4096
plotting:
  figsize:
  - 16
  - 10
  dpi: 200
  # Ordering for group_token_probability_table:
  # - key_logit (default): all keys globally by decreasing e^{l_i}/Z (blue curve continuous, on top)
  # - group_then_key: groups by decreasing e^{l_g}, then keys in-group by e^{l_i}/Z
  group_token_probability_order: "key_logit"
  log_scale: true
  linear_scale: true
  idealized_linestyle: --
  algorithm_linestyle: '-'
  error_bands: false
  idealized_colors:
    IdealTopK: '#d62728'
    IdealSampling: '#2ca02c'
    IdealEqualSplits: '#1f77b4'
