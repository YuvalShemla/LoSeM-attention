model:
  hf_name: meta-llama/Meta-Llama-3.1-8B
  mlx_name: mlx-community/Meta-Llama-3.1-8B-bf16
  num_layers: 32
  num_q_heads: 32
  num_kv_heads: 8
  head_dim: 128
  context_window: 131072
  rope:
    theta: 500000.0
    method: standard
    scaling: null
    source: model.rotary_emb
data:
  vectors_dir: data/vectors
  results_dir: results
tasks:
- code_run
skip_idealized:
- ideal_equal_splits
- ideal_sampling_is
- ideal_equal_weight_splits
evaluation:
  seed: 42
  n_queries: 1
  n_examples: 1
  use_rope: true
  normalize_keys_to_median_norm: false
  normalize_queries_to_median_norm: false
  compute_statistics: false
  compute_group_cosine_distribution: false
  head_mode: "custom"
  custom_heads:
    - {layer: 15, q_head: 21, kv_head: 5}
  exclude_sink_token: true
  local_window:
    size: 128
  budget_sweep:
    absolute:
    - 1024
    - 2048
    - 4096
    - 8192
algorithm_configs:
  mq_beta_cluster:
    topk_frac: 0.0
    m_pq: 8
    n_clusters: 8192
  vattention_pq:
    m_sweep:
    - 8
plotting:
  figsize: [16, 10]
  dpi: 200
  error_bands: false
  budget_sweep_colors:
    PQTopK+MQBeta: '#7b1fa2'
    OracleTopK+MQBeta: '#fbc02d'
    vAttention(PQ-m8): '#795548'
  dashed_prefixes:
  - Oracle
  idealized_colors:
    IdealTopK: '#d62728'
