model:
  hf_name: meta-llama/Meta-Llama-3.1-8B
  mlx_name: mlx-community/Meta-Llama-3.1-8B-bf16
  num_layers: 32
  num_q_heads: 32
  num_kv_heads: 8
  head_dim: 128
  context_window: 131072
  rope:
    theta: 500000.0
    method: standard
    scaling: null
    source: model.rotary_emb
data:
  vectors_dir: data/vectors
  results_dir: results
tasks:
- math_calc
- code_run
- longbook_sum_eng
- kv_retrieval
- multi_doc_qa
- single_doc_qa
skip_idealized:
- ideal_equal_splits
- ideal_sampling_is
- ideal_equal_weight_splits
evaluation:
  seed: 42
  n_queries: 20
  n_examples: 1
  use_rope: true
  normalize_keys_to_median_norm: false
  normalize_queries_to_median_norm: false
  compute_statistics: false
  compute_group_cosine_distribution: false
  head_mode: "selected_heads"
  selected_percentiles:
  - 50
  - 75
  - 100
  exclude_sink_token: true
  local_window:
    size: 128
  budget_sweep:
    absolute:
    - 64
    - 128
    - 256
    - 512
    - 1024
    - 2048
    - 4096
algorithm_configs:
  mq_beta_cluster:
    topk_frac: 0.875
    m_pq: 8
    n_clusters: 512
  mq_cluster_topk:
    topk_frac: 0.875
    m_pq: 8
  topk_cluster_eval:
    topk_frac: 0.875
    m_pq: 8
    variants:
    - {topk: pq, cluster: kmeans, order: 0}
  vattention_pq:
    m_sweep:
    - 8
  pq_full_attn:
    m_pq: 8
plotting:
  figsize: [16, 10]
  dpi: 200
  log_scale: true
  linear_scale: true
  error_bands: false
  dashed_prefixes:
  - Oracle
  - PQFullAttn
  budget_sweep_colors:
    PQTopK+MQBeta: '#7b1fa2'
    OracleTopK+MQBeta: '#fbc02d'
    PQTopK+MQCluster: '#1565c0'
    PQTopK+KeyClust: '#e65100'
    vAttention(PQ-m8): '#795548'
    PQFullAttn: '#212121'
  idealized_colors:
    IdealTopK: '#d62728'
    IdealSampling: '#2ca02c'
